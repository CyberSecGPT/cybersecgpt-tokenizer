name: CyberSecGPT Agent Policy Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify-agent-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify CyberSecGPT V2.1 agent policy integrity
        run: python install_cybersecgpt_agent_directives.py --repo . --verify
