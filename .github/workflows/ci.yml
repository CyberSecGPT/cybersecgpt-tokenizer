name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out Tokenizer
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m black --check .

      - name: Run strict mypy
        run: python -m mypy src scripts

      - name: Validate repository security and dependency boundaries
        run: python scripts/validate_repository.py

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify split-package import
        run: python -c "import cybersecgpt.tokenizer"

      - name: Run tests with 100% source coverage
        run: >-
          python -m pytest
          --cov=cybersecgpt.tokenizer
          --cov-report=term-missing
          --cov-fail-under=100

      - name: Check out exact accepted dataset snapshot
        run: |
          mkdir -p .evidence/cybersecgpt-datasets
          git -C .evidence/cybersecgpt-datasets init
          git -C .evidence/cybersecgpt-datasets remote add origin https://github.com/CyberSecGPT/cybersecgpt-datasets.git
          git -C .evidence/cybersecgpt-datasets fetch --depth=1 origin a8573904fd944e9be26e911d768e7335e4bdf1e0
          git -C .evidence/cybersecgpt-datasets checkout --detach FETCH_HEAD

      - name: Replay exact P6.11 training evidence offline
        env:
          PYTHONPATH: src:.:.evidence/cybersecgpt-datasets/src
        run: python scripts/verify_p6_11_training_run.py

  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tokenizer
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Verify distribution boundaries
        run: python scripts/verify_distribution.py dist
